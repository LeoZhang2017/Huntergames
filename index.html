<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Game UI Elements -->
        <div id="start-screen">
            <button id="start-button">Start Game</button>
        </div>

        <div id="hud">
            <div id="health-bar">
                <span>Health:</span>
                <span id="health-value">100</span>
            </div>
            <div id="ammo-counter">
                <span>Ammo:</span>
                <span id="ammo-value">0</span>
            </div>
            <div id="coins-counter">
                <span>Coins:</span>
                <span id="coins-value">0</span>
            </div>
        </div>

        <div id="inventory">
            <!-- Inventory items will be added here dynamically -->
        </div>

        <div id="game-message">
            <!-- Game messages will be displayed here -->
        </div>

        <div id="current-stage">
            <!-- Current stage name will be displayed here -->
        </div>

        <!-- Pause Menu Overlay (hidden by default; shown when ESC releases pointer lock mid-game) -->
        <div id="pause-menu" class="pause-menu" hidden>
            <div class="pause-menu__panel">
                <h2 class="pause-menu__title">Paused</h2>
                <div class="pause-menu__buttons">
                    <button id="pause-resume" class="pause-menu__btn pause-menu__btn--primary" type="button">Resume</button>
                    <button id="pause-restart" class="pause-menu__btn" type="button">Restart Stage</button>
                    <button id="pause-quit" class="pause-menu__btn pause-menu__btn--danger" type="button">Quit to Main Menu</button>
                </div>
                <p class="pause-menu__hint">Press <kbd>ESC</kbd> or click Resume to return to the game.</p>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="game.js"></script>
    <!-- Pause menu controller — must load AFTER game.js to override its
         pauseGame/resumeGame globals. -->
    <script src="pause-menu.js"></script>
    <!-- FPS / performance overlay (toggle with F3). Standalone — no
         ordering requirement; reads game.js's `renderer` global lazily. -->
    <script src="fps-overlay.js"></script>
    <!-- Audio: synthesized SFX + settings (gear icon top-right). Loads
         AFTER game.js so it can wrap its globals (reloadWeapon,
         showPickupMessage, createEnhancedImpactEffect, gameOver). Should
         load AFTER pause-menu.js so it wraps the pause-menu's resumeGame
         too (to resume AudioContext on Resume). -->
    <script src="audio.js"></script>
</body>
</html>
